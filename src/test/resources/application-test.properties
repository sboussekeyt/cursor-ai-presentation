# Test Application Configuration
spring.application.name=task-management-api-test

# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Test Configuration
jwt.secret=TestSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS256AlgorithmTesting
jwt.expiration=3600000

# Logging Configuration for Tests
logging.level.com.taskmanagement=INFO
logging.level.org.springframework=WARN
